name: aiweb

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run start-docker.ps1 first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhizhi_knowledge}
      MYSQL_USER: ${MYSQL_USER:-zhizhi_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run start-docker.ps1 first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
